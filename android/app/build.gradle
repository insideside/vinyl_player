plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.insideside.vinylplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.insideside.vinylplayer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        python {
            version "3.11"
            pip {
                install "mutagen"
                install "httpx"
                install "musicbrainzngs"
                install "vkpymusic"
                install "cryptography"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Copy vinyl_player.py from project root before each build
tasks.register('copyPythonSource', Copy) {
    from '../../vinyl_player.py'
    into 'src/main/python'
}
preBuild.dependsOn copyPythonSource

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
